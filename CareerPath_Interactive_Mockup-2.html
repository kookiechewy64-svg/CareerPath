<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareerPath Interactive Mockup</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #e5e7eb;padding:18px 12px}.brand{display:flex;gap:10px;align-items:center;margin:0 8px 24px}.logo{width:36px;height:36px;border-radius:10px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:19px}.brand small{display:block;color:#667085}.group{font-size:10px;color:#98a2b3;font-weight:bold;margin:18px 8px 7px}.nav{width:100%;border:0;background:transparent;padding:11px 9px;border-radius:9px;text-align:left;font-size:12px;color:#475467;cursor:pointer;margin:2px 0}.nav.active,.nav:hover{background:#eef2ff;color:#4f46e5;font-weight:bold}.badge{float:right;background:#fce7f3;color:#db2777;border-radius:10px;padding:2px 6px}.main{padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{font-size:22px;margin:0 0 4px}.top p{margin:0;color:#667085;font-size:12px}.search{padding:10px;border:1px solid #e5e7eb;border-radius:9px;width:250px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:16px}.card small,.muted{color:#667085;font-size:10px}.big{font-size:24px;font-weight:800;margin:5px 0}.up{font-size:9px;color:#16a34a}.content{display:grid;grid-template-columns:1.5fr 1fr;gap:13px;margin-top:13px}.panel h2{font-size:15px;margin-top:0}.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f5}.row:last-child{border:0}.bar{height:7px;background:#edf0f5;border-radius:10px;overflow:hidden;flex:1}.fill{height:100%;background:#4f46e5}.result{margin-top:13px;padding:13px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;font-size:11px;line-height:1.5}.btn,.choice{cursor:pointer;border-radius:8px;padding:10px;border:1px solid #cfd4ff;background:#4f46e5;color:#fff;font-size:11px;font-weight:bold}.choice{display:block;width:100%;text-align:left;background:#fff;color:#172033;border-color:#e5e7eb;margin:7px 0}.choice:hover{background:#f8f9ff;border-color:#a5b4fc}.tag{background:#eef2ff;color:#4f46e5;border-radius:10px;padding:4px 7px;font-size:9px}@media(max-width:750px){.app{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid #e5e7eb}.brand,.group{display:none}.nav{white-space:nowrap;width:auto}.main{padding:14px}.search{display:none}.cards{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">C</div><div><b>CareerPath</b><small>Student Dashboard</small></div></div><div class="group">MAIN</div><button class="nav active" data-p="dashboard">◈ Dashboard</button><button class="nav" data-p="roadmap">⌁ Career Roadmap</button><button class="nav" data-p="assessment">☷ Skill Assessment <span class="badge">4</span></button><button class="nav" data-p="portfolio">▣ My Portfolio <span class="badge">3</span></button><div class="group">DEVELOPMENT</div><button class="nav" data-p="learning">◆ Learning Path</button><button class="nav" data-p="projects">⌘ Projects & Experience</button><button class="nav" data-p="mentoring">♟ Mentorship</button><div class="group">INTELLIGENCE</div><button class="nav" data-p="analytics">⌁ Career Analytics</button></aside><main class="main"><div class="top"><div><h1 id="title">Executive Dashboard</h1><p id="sub">Pantau perkembangan kesiapan karier kamu.</p></div><input class="search" placeholder="⌕ Cari karier, modul, atau keahlian..."></div><div id="view"></div></main></div><script>
const V=document.getElementById('view'),T=document.getElementById('title'),S=document.getElementById('sub');
const pages={
dashboard:['Executive Dashboard','Pantau perkembangan kesiapan karier kamu.',`<div class="cards"><div class="card"><small>Career Readiness</small><div class="big">82%</div><div class="up">↗ +18.4% vs bulan lalu</div></div><div class="card"><small>Skill Match Index</small><div class="big">89.7%</div><div class="up">↗ +23.1% vs target</div></div><div class="card"><small>Target Milestones</small><div class="big">147 Hari</div><div class="muted">12 aktif</div></div><div class="card"><small>Skill Gap Alert</small><div class="big">3 Skill</div><div class="muted">AI, SQL, Public Speaking</div></div></div><div class="content"><section class="panel"><h2>Komposisi Keahlian Saat Ini</h2>${[['Technical Skills',76],['Soft & Leadership',59],['Domain Knowledge',48],['Tools & Software',32]].map(x=>`<div class="row"><span style="width:125px;font-size:10px">${x[0]}</span><div class="bar"><div class="fill" style="width:${x[1]}%"></div></div><b style="font-size:10px">${x[1]}%</b></div>`).join('')}</section><section class="panel"><h2>Status Progress Roadmap</h2>${[['12','In Progress Milestones'],['41','Completed Steps'],['28','Reviewing by Mentor'],['26','Upcoming Tasks']].map(x=>`<div class="row"><b>${x[0]}</b><span style="font-size:10px">${x[1]}</span></div>`).join('')}<div class="result"><b>Rekomendasi:</b> fokus pada 3 skill gap utama.</div></section></div>`],
assessment:['Skill Assessment','Uji kemampuan dan temukan skill gap kamu.',`<section class="panel"><h2>Assessment: Digital Marketing</h2><p class="muted">Seberapa familiar kamu dengan analisis data menggunakan Excel?</p><button class="choice" data-s="25">Belum pernah</button><button class="choice" data-s="50">Dasar</button><button class="choice" data-s="75">Cukup mahir</button><button class="choice" data-s="100">Sangat mahir</button><div id="result"></div></section>`],
roadmap:['Career Roadmap','Rencana perjalanan menuju target karier.',`<section class="panel"><h2>Roadmap: Digital Marketing Specialist</h2>${[['1','Kenali minat & potensi','Selesai'],['2','Bangun skill dasar','Selesai'],['3','Kuasai SEO & Analytics','Sedang berjalan'],['4','Buat portfolio proyek','Belum dimulai'],['5','Persiapan melamar kerja','Belum dimulai']].map(x=>`<div class="row"><b>${x[0]}</b><span style="flex:1;font-size:11px"><b>${x[1]}</b><br><span class="muted">${x[2]}</span></span><span class="tag">${x[2]}</span></div>`).join('')}<div class="result"><b>Target berikutnya:</b> selesaikan modul SEO & Analytics.</div></section>`],
portfolio:['My Portfolio','Kelola bukti pengalaman dan proyek.',`<section class="panel"><h2>Portfolio Score: 85/100</h2><div class="cards"><div class="card"><small>Projects</small><div class="big">6</div></div><div class="card"><small>Verified Skills</small><div class="big">12</div></div><div class="card"><small>Certificates</small><div class="big">4</div></div></div><div class="result">Portfolio sudah cukup kuat. Tambahkan proyek SQL atau data analysis.</div><button class="btn" id="more">Lihat rekomendasi proyek</button><div id="out"></div></section>`],
learning:['Learning Path','Materi belajar berdasarkan skill gap.',`<section class="panel"><h2>Learning Path yang Direkomendasikan</h2>${[['SQL Dasar','72%'],['Digital Marketing Analytics','45%'],['Public Speaking','20%']].map(x=>`<div class="row"><span style="flex:1;font-size:11px"><b>${x[0]}</b><div class="bar"><div class="fill" style="width:${x[1]}"></div></div></span><span class="muted">${x[1]}</span></div>`).join('')}<button class="btn" id="next">Tampilkan modul berikutnya</button><div id="out"></div></section>`],
projects:['Projects & Experience','Hubungkan pengalaman dengan kebutuhan karier.',`<section class="panel"><h2>Pengalaman yang Tercatat</h2>${['Project Dashboard Excel','Organisasi Kampus','Proyek Analisis Data'].map(x=>`<div class="row"><b style="font-size:11px">${x}</b><span class="tag">Verified</span></div>`).join('')}<div class="result"><b>CareerPath Match:</b> pengalaman paling relevan dengan Data Analyst dan Digital Marketing.</div></section>`],
mentoring:['Mentorship','Dapatkan arahan dari mentor.',`<section class="panel"><h2>Mentor yang Sesuai</h2>${[['Alya Putri','Digital Marketing','94%'],['Rizky Pratama','Data Analyst','89%']].map(x=>`<div class="row"><span style="flex:1;font-size:11px"><b>${x[0]}</b><br><span class="muted">${x[1]}</span></span><span class="tag">${x[2]} match</span><button class="btn choose">Pilih</button></div>`).join('')}<div id="out"></div></section>`],
analytics:['Career Analytics','Lihat perkembangan dan kecocokan karier.',`<div class="cards"><div class="card"><small>Career Readiness</small><div class="big">82%</div></div><div class="card"><small>Skill Match</small><div class="big">89.7%</div></div><div class="card"><small>Portfolio</small><div class="big">85/100</div></div><div class="card"><small>Skill Gap</small><div class="big">3</div></div></div><section class="panel" style="margin-top:13px"><h2>Rekomendasi Karier Berdasarkan Profil</h2>${[['Digital Marketing Specialist','91%'],['Data Analyst','87%'],['HR Development','76%']].map(x=>`<div class="row"><b style="font-size:11px">${x[0]}</b><b style="color:#4f46e5">${x[1]} match</b></div>`).join('')}<div class="result"><b>Insight:</b> kombinasi skill analisis, komunikasi, dan digital menjadi area utama.</div></section>`]};
function render(p){let d=pages[p]||pages.dashboard;T.textContent=d[0];S.textContent=d[1];V.innerHTML=d[2];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.p===p));V.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{let s=+b.dataset.s;document.getElementById('result').innerHTML=`<div class="result"><b>Hasil Assessment:</b> skor kamu <strong>${s}/100</strong>. ${s<60?'Rekomendasi: modul dasar Excel.':s<85?'Rekomendasi: latihan analisis data tingkat menengah.':'Kamu siap mengambil modul analisis data lanjutan.'}</div>`});let m=document.getElementById('more');if(m)m.onclick=()=>document.getElementById('out').innerHTML='<div class="result"><b>Rekomendasi proyek:</b> buat dashboard penjualan menggunakan Excel dan tambahkan analisisnya ke portfolio.</div>';let n=document.getElementById('next');if(n)n.onclick=()=>document.getElementById('out').innerHTML='<div class="result"><b>Modul berikutnya:</b> SQL SELECT, WHERE, GROUP BY dan latihan laporan data.</div>';V.querySelectorAll('.choose').forEach(b=>b.onclick=()=>document.getElementById('out').innerHTML='<div class="result"><b>Mentor dipilih.</b> Simulasi jadwal konsultasi: Jumat, 15.00 WIB.</div>')}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(b.dataset.p));render('dashboard');
</script></body></html>
